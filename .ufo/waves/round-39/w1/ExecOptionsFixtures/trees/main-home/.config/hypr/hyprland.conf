# hyprland.conf — main entry (fixed)
# hyprlang noerror
$moddir = ~/.config/hypr/modules
source = ~/.config/hypr/defaults/00-defaults.conf
source = ~/.config/hypr/user.conf
source = ~/.config/hypr/toggles/*.conf
source = ~/.config/hypr/ai-usage.conf
source = $moddir/base.conf
general:colormode = rgb                    # trailing comment
misc:font_family = JetBrains Mono ## Nerd Font
workspace = 1, gapsout:10
windowrule = float, class:^(kitty)$
animation = windowsIn, 1, 3, popin
bind = SUPER, Q, exec, kitty
exec-once = waybar
misc:disable_autoreload = false
